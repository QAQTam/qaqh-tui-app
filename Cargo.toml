[package]
name = "qaqh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the QAQ-Harness daemon (Ringing protocol v1)"
license = "MIT"

[[bin]]
name = "qaqh-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
futures = "0.3"
chrono = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = "symbols"
