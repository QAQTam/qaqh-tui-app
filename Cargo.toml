[package]
name = "qaqh-tui"
version = "2.0.0-alpha1"
edition = "2024"
description = "Terminal UI client for the QAQ-Harness daemon (Ringing protocol v1)"
license = "MIT"

[[bin]]
name = "qaqh-tui"
path = "src/main.rs"

[dependencies]
# 传输层权威实现（Ringing V1 客户端）。T-01 阶段一后，连接生命周期、三频道
# SSE 流与 per-seed timeline 流全部由它承担，本仓不再自建。
#
# 路径依赖跨 workspace 正常工作（qaqh-client 经 path 依赖 qaqh-domain/
# qaqh-ringing/qaqh-types，并用 version/lints workspace = true）；代价是后端
# 仓必须与该相对路径共存——离线单独分发 TUI 时会断。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 配置契约层（`ConfigDto` 读模型 / `ConfigPatch` 写模型）。与 qaqh-client 同款
# 取舍：直接吃权威类型，本仓不再手工镜像（阶段二 config 切片，T-11）。
# 该 crate 只依赖 serde，不牵入 runtime/daemon 构建。
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
anyhow = "1"
base64 = "0.22"
thiserror = "2"
futures = "0.3"
chrono = "0.4"
# 日志门面：`qaqh-client` 的诊断（timeline 重连原因 / 快照恢复失败 / cursor
# 解析告警）全部走 `log`。本仓**只**在 `QAQH_TUI_LOG=<path>` 时安装一个极简
# 文件 logger（见 main.rs），默认不安装、不写盘、不改变行为。
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = "5"

# ── 本地 ratatui 工作树（main @ e02e2a62）──────────────────────────────
# 上游已合并「宽字符仅样式变化时尾部单元格残留」的修复（ratatui#2743 / 7babd829），
# 但尚未发版。先按 path 跟随 main 拿到修复；等 ratatui 发下一个版本后删除本节即可
# （届时无需任何代码改动）。
#
# 复现/验证（本仓实验）：0.30.2 上同一宽字形只改样式时 diff 仅吐 [(0,0,字形)]，
# 尾部单元格缺失 → 汉字右侧残留上一帧底色；main 上为 [(1,0," "), (0,0,字形)]。
#
# ⚠ 下列包必须同源。只 patch 门面会得到「未发版 ratatui + 已发版 ratatui-core」
# 的错配组合，编译期未必报错但语义已漂移。
[patch.crates-io]
ratatui = { path = "../ratatui/ratatui" }
ratatui-core = { path = "../ratatui/ratatui-core" }
ratatui-crossterm = { path = "../ratatui/ratatui-crossterm" }
ratatui-macros = { path = "../ratatui/ratatui-macros" }
ratatui-widgets = { path = "../ratatui/ratatui-widgets" }

[profile.release]
lto = "thin"
strip = "symbols"
