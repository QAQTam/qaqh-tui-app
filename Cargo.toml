[package]
name = "qaqh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the QAQ-Harness daemon (Ringing protocol v1)"
license = "MIT"

[[bin]]
name = "qaqh-tui"
path = "src/main.rs"

[dependencies]
# 传输层权威实现（Ringing V1 客户端）。T-01 阶段一后，连接生命周期、三频道
# SSE 流与 per-seed timeline 流全部由它承担，本仓不再自建。
#
# 路径依赖跨 workspace 正常工作（qaqh-client 经 path 依赖 qaqh-domain/
# qaqh-ringing/qaqh-types，并用 version/lints workspace = true）；代价是后端
# 仓必须与该相对路径共存——离线单独分发 TUI 时会断。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 配置契约层（`ConfigDto` 读模型 / `ConfigPatch` 写模型）。与 qaqh-client 同款
# 取舍：直接吃权威类型，本仓不再手工镜像（阶段二 config 切片，T-11）。
# 该 crate 只依赖 serde，不牵入 runtime/daemon 构建。
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
futures = "0.3"
chrono = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = "symbols"
